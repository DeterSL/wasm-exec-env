[package]
name = "wasm-exec-env"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
noop-logger = []
noop-filter = []

[dependencies]
wasmtime = { git = "https://github.com/DeterSL/wasmtime.git", branch = "release-35.0.0-detersl", features = ["cache"] }
wasmtime-wasi = { git = "https://github.com/DeterSL/wasmtime.git", branch = "release-35.0.0-detersl" }
anyhow = "1.0"
hex = "0.4"
lru = "0.16"
parking_lot = "0.12"
sha2 = "0.10"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
rand_core = "0.9.3"
rand = "0.9.2"
cap-rand = "3.4.4"
log = "0.4.27"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.16", features = ["server", "http1", "tokio"] }
bytes = "1.10.1"
http-body-util = "0.1.3"
env_logger = "0.11.8"
http = "1.3.1"
http-body = "1.0.1"
async-trait = "0.1.89"
futures = "0.3.31"
reqwest = { version = "0.12.23", features = ["blocking", "rustls-tls", "json"] }
chrono = "0.4.42"
cxx = "1.0.186"
sonic-rs = "0.5.5"
moka = { version = "0.12.12", features = ["future", "sync"] }
once_cell = "1.21.3"

[profile.release]
opt-level = 3          # maximum optimization for speed
lto = "fat"            # best runtime perf (use "thin" for faster builds)
codegen-units = 1      # better optimization across crate, slower compile
panic = "abort"        # removes unwinding code
debug = false          # no debug info
debug-assertions = false
overflow-checks = false
incremental = false

[build-dependencies]
cxx-build = "1"

[lib]
crate-type = ["rlib", "staticlib"]
name = "detersl"
path = "src/lib.rs"

[[bin]]
# Your existing binary
name = "detersl-server"
path = "src/main.rs"
